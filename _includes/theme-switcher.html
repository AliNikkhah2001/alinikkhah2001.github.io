<div class="theme-switcher" role="group" aria-label="Theme switcher">
  <button class="theme-dot" data-theme="vhs" title="VHS (default)" aria-label="VHS theme"></button>
  <button class="theme-dot" data-theme="cyberpunk" title="Cyberpunk" aria-label="Cyberpunk theme"></button>
  <button class="theme-dot" data-theme="zen" title="Zen" aria-label="Zen theme"></button>
  <button class="theme-dot" data-theme="academic" title="Academic" aria-label="Academic theme"></button>
  <button class="theme-dot" data-theme="terminal" title="Terminal" aria-label="Terminal theme"></button>
  <button class="theme-dot" data-theme="midnight" title="Midnight" aria-label="Midnight theme"></button>
</div>
<script>
(function(){
  const key='alinikkhah-theme';
  const dots=document.querySelectorAll('.theme-dot');
  let cur=localStorage.getItem(key)||'vhs';
  function apply(t){
    document.body.className=document.body.className.replace(/theme-\w+/g,'').trim();
    if(t!=='vhs') document.body.classList.add('theme-'+t);
    if(t!=='vhs'){
      let l=document.getElementById('theme-variant');
      if(!l){l=document.createElement('link');l.id='theme-variant';l.rel='stylesheet';document.head.appendChild(l);}
      l.href='/assets/css/theme-'+t+'.css';
    } else {
      const l=document.getElementById('theme-variant'); if(l) l.remove();
    }
    dots.forEach(d=>d.classList.toggle('active', d.dataset.theme===t));
  }
  apply(cur);
  dots.forEach(d=>d.addEventListener('click',()=>{cur=d.dataset.theme;localStorage.setItem(key,cur);apply(cur);}));
})();
</script>
